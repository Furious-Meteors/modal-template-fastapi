site_name: modal-template-fastapi
site_description: A production-ready FastAPI template deployed serverlessly on Modal — JWT auth, full CRUD, and automated CI/CD out of the box.
site_url: https://your-org.github.io/modal-template-fastapi/
repo_name: modal-template-fastapi
repo_url: https://github.com/your-org/modal-template-fastapi
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 modal-template-fastapi

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/rocket-launch
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - announce.dismiss

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/modal-template-fastapi
      name: GitHub
  generator: false

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en
  - swagger-ui-tag

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.keys

nav:
  - Home: index.md
  - Architecture: architecture.md
  - API Reference:
    - api/index.md
    - Endpoints: api/endpoints.md
    - Authentication: api/auth.md
  - Testing: testing.md
  - CI/CD: cicd.md
  - Deployment: deployment.md
