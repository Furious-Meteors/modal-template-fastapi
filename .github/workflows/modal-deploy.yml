name: CI/CD

on:
  push:
    branches:
      - "feat/**"
    paths-ignore:
      - ".github/workflows/**"

  pull_request:
    types: [closed]
    branches:
      - dev
      - production

jobs:
  deploy:
    name: Deploy to Modal
    runs-on: ubuntu-latest

    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Set Modal environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/heads/feat/* ]]; then
            echo "deploy_env=${{ vars.FEAT }}" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "dev" ]; then
            echo "deploy_env=${{ vars.DEV }}" >> "$GITHUB_OUTPUT"

          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "production" ]; then
            echo "deploy_env=${{ vars.PRODUCTION }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deployment config
        run: |
          test -n "${{ steps.set-env.outputs.deploy_env }}"
          echo "Deploying modal_app.py to Modal env: ${{ steps.set-env.outputs.deploy_env }}"

      - name: Deploy to Modal
        env:
          MODAL_ENV: ${{ steps.set-env.outputs.deploy_env }}
        run: |
          echo "MODAL_ENV=$MODAL_ENV"
          modal deploy modal_app.py --env "$MODAL_ENV"