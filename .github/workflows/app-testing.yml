name: App Testing

on:
  pull_request:
    branches:
      - dev
      - production

  workflow_call: # callable from other workflows (e.g. modal-deploy.yml)

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements/test.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
