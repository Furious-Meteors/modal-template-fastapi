name: App Testing

on:
  pull_request:
    branches:
      - dev
      - production

  workflow_call: # callable from other workflows (e.g. modal-deploy.yml)

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest

    # Disposable Postgres so the repository contract tests run against the real
    # adapter, not only the in-memory one. Never point TEST_DATABASE_URL at real data.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pgpass
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:pgpass@localhost:5432/app

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements/test.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
